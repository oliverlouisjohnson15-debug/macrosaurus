    src:url(/fonts/plex-mono-400.woff2) format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:block;
    src:url(/fonts/plex-mono-700.woff2) format('woff2');}
  body{margin:0;background:#333;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;
       font-family:ui-monospace,monospace;color:#eee;}
  canvas{image-rendering:auto;box-shadow:0 4px 24px rgba(0,0,0,.5);max-width:100%;height:auto;}
  a{color:#F0B429;}

<body>
<!--
  THE OG CARD, at its real 1200x630. This is the source; og.png is the export.
  It is drawn on a canvas rather than laid out in HTML so that it can be exported to PNG from
  the page itself (see the download link) without a headless-browser screenshot step.

  It follows the site after the paper-terrarium redesign, so it must keep matching it:
    - headline in Plex Mono 700, NOT the pixel face (the site demoted the pixel face to labels,
      numbers and chrome; a headline in Silkscreen has no curves to rest on at this size)
    - Silkscreen for the wordmark, the labels and every number
    - segmented pip meters, not smooth bars, because that is what the app draws
    - gold is a FILL behind dark type, never gold type on the purple
-->
<canvas id="og" width="1200" height="630"></canvas>
<p><a id="dl" download="og.png">Download og.png</a> &middot; 1200&times;630</p>
<script>
(function(){
  var INK='#241f2e', PURPLE='#5B4FA6', CREAM='#fffdf7', GOLD='#F0B429',
      TEAL='#2E7D6B', PRO='#C7472F', CARB='#3D6FB4', FAT='#E0A21B',
      TRACK='#ece7dc', PAPER='#e7e3da', OFF='#ddd7f2';
  var c=document.getElementById('og'), x=c.getContext('2d');

  function rect(a,b,w,h,fill){ x.fillStyle=fill; x.fillRect(a,b,w,h); }
  // an ink frame plus the hard offset shadow, the two primitives the whole design is built from
  function panel(a,b,w,h,fill){
    rect(a+7,b+7,w,h,INK);
    rect(a,b,w,h,fill);
    x.strokeStyle=INK; x.lineWidth=5; x.strokeRect(a+2.5,b+2.5,w-5,h-5);
  }
  function pips(a,b,w,h,n,on,colour){
    rect(a,b,w,h,INK);
    var gap=2, cw=(w-4-gap*(n-1))/n;
    for(var i=0;i<n;i++) rect(a+2+i*(cw+gap), b+2, cw, h-4, i<on?colour:TRACK);
  }

  // ---- the card ----
  rect(0,0,1200,630,PURPLE);
  x.strokeStyle=INK; x.lineWidth=10; x.strokeRect(5,5,1190,620);

  // wordmark
  var egg=new Image();
  function draw(){
    x.textBaseline='alphabetic';
    x.font='34px Silkscreen, monospace'; x.fillStyle=CREAM;
    x.fillText('MACROSAURUS', 108, 78);

    // headline, Plex Mono 700, with the last line sitting on a gold fill
    x.font='700 62px "IBM Plex Mono", monospace'; x.fillStyle=CREAM;
    x.fillText("The macro tracker", 62, 210);
    x.fillText("you'll still be", 62, 288);
    var tail="using in March.";
    var w=x.measureText(tail).width;
    rect(56, 316, w+16, 74, GOLD);
    x.fillStyle=INK; x.fillText(tail, 64, 372);

    // the strapline, in the on-header gold so it reads as chrome rather than a second headline
    x.font='22px Silkscreen, monospace'; x.fillStyle='#FFD05E';
    x.fillText('FREE FOREVER PLAN · NO CARD TO START', 62, 452);
    x.fillStyle=OFF; x.font='20px "IBM Plex Mono", monospace';
    x.fillText('Food · Eating out · Training · Made in the UK', 62, 500);

    // ---- the Today card, as the app actually draws it ----
    var px=800, py=118, pw=340, ph=396;
    panel(px,py,pw,ph,CREAM);
    rect(px+5,py+5,pw-10,44,INK);
    x.font='18px Silkscreen, monospace'; x.fillStyle='#f4f1ea';
    x.fillText('TODAY', px+22, py+35);
    x.fillStyle=GOLD; x.fillText('ON TRACK', px+pw-140, py+35);

    x.textAlign='center';
    x.font='64px Silkscreen, monospace'; x.fillStyle=TEAL;
    x.fillText('1,412', px+pw/2, py+140);
    x.font='17px Silkscreen, monospace'; x.fillStyle='#6b6459';
    x.fillText('KCAL LEFT', px+pw/2, py+176);
    x.textAlign='left';

    var rows=[['PROTEIN','148 / 190g',8,PRO],['CARBS','176 / 240g',7,CARB],['FAT','41 / 62g',6,FAT]];
    rows.forEach(function(r,i){
      var ry=py+218+i*62;
      x.font='16px Silkscreen, monospace';
      x.fillStyle=INK;      x.fillText(r[0], px+24, ry);
      x.fillStyle='#6b6459';
      x.textAlign='right';  x.fillText(r[1], px+pw-24, ry); x.textAlign='left';
      pips(px+24, ry+12, pw-48, 24, 10, r[2], r[3]);
    });

    if (egg.complete && egg.naturalWidth) {
      x.imageSmoothingEnabled=false;
      x.drawImage(egg, 58, 44, 40, 40);
    }
    document.getElementById('dl').href = c.toDataURL('image/png');
    window.__ogReady = true;
  }
  egg.onload = draw; egg.onerror = draw; egg.src = 'egg.png';
  document.fonts.ready.then(function(){ setTimeout(draw, 60); });
})();
</script>
</body>
</html>
