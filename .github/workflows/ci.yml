name: CI

# Runs the test suite on every push and pull request to main.
# Ready to use once the repo is committed with git (tests/, package.json and app/*.js included).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand from the Actions tab. Worth having on its own, and specifically
  # for the case where a run never gets a hosted runner and is auto-cancelled at the 15-minute mark:
  # without this the only way to retry is an empty commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
