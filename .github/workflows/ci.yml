name: CI

# Runs the test suite on every push and pull request to main.
# Ready to use once the repo is committed with git (tests/, package.json and app/*.js included).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand from the Actions tab. Worth having on its own, and specifically
  # for the case where a run never gets a hosted runner and is auto-cancelled at the 15-minute mark:
  # without this the only way to retry is an empty commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Without this the run is not testing what it looks like it is testing. Most of the suite is
      # pure and needs nothing installed, so `npm test` on a bare checkout goes green on well over a
      # thousand assertions - while tests/render.test.js, which needs jsdom, React and Babel to
      # render the real screens, fails to load and counts as a single failure. Every screen test in
      # the project was in that file, so none of them have ever actually run here.
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
